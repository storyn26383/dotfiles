onboarding = false

# Matches the tmux status bar drawn by powerline's `sasaya` colorscheme (xterm-256 indexes
# noted beside each value). herdr has no such built-in, so every token is overridden on top
# of catppuccin. Backgrounds are `reset` so the bar shows the terminal background (Alacritty
# #181818); that is also what makes herdr draw the active tab text in surface_dim (white).
# green/yellow/red are tmux's named ANSI colors (active pane border, copy-mode, bell), which
# Alacritty renders from its default palette since dot_alacritty.toml sets none.
[theme]
name = "catppuccin"

[theme.custom]
accent = "#0087af"        # colour31 darkblue: current window, focused pane border, mode bar
panel_bg = "reset"        # bar, popups, mode bar: terminal background
sidebar_bg = "reset"
active_row_bg = "#303030" # colour236 gray2
selection_bg = "#4e4e4e"  # colour239
surface0 = "reset"        # inactive tab background follows the terminal background, like the bar
surface1 = "#303030"      # colour236 gray2
surface_dim = "#ffffff"   # colour231 white: active tab text (also sidebar separators)
overlay0 = "#808080"      # colour244 gray6: inactive window index, unfocused pane border
overlay1 = "#bcbcbc"      # colour250 gray9: load / date text
text = "#ffffff"          # colour231 white
subtext0 = "#b2b2b2"      # colour249 gray70: inactive window name
mauve = "#87d7ff"         # colour117 mediumcyan: resize mode
green = "#90a959"         # ANSI green: tmux active pane border, done
yellow = "#f4bf75"        # ANSI yellow: tmux copy-mode / message, working
red = "#ac4242"           # ANSI red: tmux bell, blocked
blue = "#0087af"          # colour31 darkblue
teal = "#87d7ff"          # colour117 mediumcyan
peach = "#d75f00"         # colour166 mediumorange: warnings

[ui]
mouse_capture = false
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
prompt_new_tab_name = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
mobile_width_threshold = 0
window_title = ""
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = "command", command = "{ cat /proc/loadavg 2>/dev/null || sysctl -n vm.loadavg; } | awk '{ gsub(/[{}]/, \"\"); printf \"%.1f %.1f %.1f\\n\", $1, $2, $3 }'", interval_seconds = 5, timeout_seconds = 2 },
  { type = "datetime", format = "%Y-%m-%d" },
  { type = "datetime", format = "%H:%M:%S" },
]

[ui.toast]
delivery = "herdr"

# top-right, like tmux's status line; it covers the right end of the tab bar while shown
[ui.toast.herdr]
position = "top-right"

[ui.sound]
enabled = false

[keys]
# tmux default bindings
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
rename_tab = "prefix+comma"
rename_workspace = "prefix+$"
split_horizontal = "prefix+double_quote"
split_vertical = "prefix+percent"
cycle_pane_next = "prefix+o"
last_pane = "prefix+semicolon"
goto = "prefix+g"
zoom = "prefix+z"
copy_mode = "prefix+["
detach = "prefix+d"
help = "prefix+?"
# bindings from dot_tmux.conf.tmpl
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
# Inside resize mode herdr matches the key after `prefix+` on its own, so a bare q (or r) exits
# like Esc. herdr rejects a prefix-less "q" because it would swallow typing.
resize_mode = ["prefix+r", "prefix+q"]
# herdr defaults kept
settings = "prefix+s"
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
# herdr defaults disabled
workspace_picker = ""
open_notification_target = ""
new_workspace = ""
new_worktree = ""
close_workspace = ""
rename_pane = ""
edit_scrollback = ""
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""
cycle_pane_previous = ""
close_pane = ""
close_tab = ""
new_tab = ""

# new tab starts in $HOME; splits keep following the current pane's directory
[[keys.command]]
key = "prefix+c"
type = "shell"
command = '"$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HOME" --focus'

# tmux `move-window -t N`: prompt for a tab number and move the current tab to that position.
# zsh `vared` in the emacs keymap gives readline editing (C-h, C-a, C-e, C-k, C-u, C-w, ...);
# Esc is bound to a widget that cancels, like Esc in tmux's command prompt. KEYTIMEOUT=1 makes a
# bare Esc fire at once instead of waiting for a possible escape sequence. tab.move takes a 0-based
# insertion point among the tabs *before* removal, so moving right needs one past the target;
# out-of-range numbers clamp to the end.
[[keys.command]]
key = "prefix+period"
type = "popup"
width = 40
height = 3
command = '''exec zsh -f -c 'bindkey -e; KEYTIMEOUT=1; cancel() { exit 0 }; zle -N cancel; bindkey "^[" cancel; n=; vared -p "move-window to: " n; [[ $n == <1-> ]] || exit 0; tabs=$("$HERDR_BIN_PATH" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID"); count=$(jq ".result.tabs | length" <<<"$tabs"); from=$(jq --arg t "$HERDR_ACTIVE_TAB_ID" ".result.tabs | map(.tab_id) | index(\$t) + 1" <<<"$tabs"); (( n > count )) && n=$count; (( n > from )) && n=$((n + 1)); printf "{\"id\":\"move\",\"method\":\"tab.move\",\"params\":{\"tab_id\":\"%s\",\"insert_index\":%d}}\n" "$HERDR_ACTIVE_TAB_ID" $((n - 1)) | nc -U -w 1 "$HERDR_SOCKET_PATH" >/dev/null' '''

# tmux choose-tree style: one row per tab in this workspace (the built-in goto lists every pane);
# the cursor starts on the current tab, like tmux, via fzf's pos() once the list has loaded
[[keys.command]]
key = "prefix+w"
type = "popup"
width = "60%"
height = "50%"
command = '''tabs=$("$HERDR_BIN_PATH" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID"); current=$(printf '%s' "$tabs" | jq --arg t "$HERDR_ACTIVE_TAB_ID" '.result.tabs | map(.tab_id) | index($t) + 1'); printf '%s' "$tabs" | jq -r '.result.tabs[] | "\(.tab_id)\t\(.number)  \(.label)  (\(.pane_count) panes)"' | fzf --delimiter='\t' --with-nth=2 --layout=reverse --no-info --prompt='tab> ' --bind="load:pos($current)" | cut -f1 | xargs -r "$HERDR_BIN_PATH" tab focus >/dev/null'''

# tmux rotate-window (C-o): every pane moves one slot back in layout order and the first one wraps
# to the last; focus stays on the same slot, now showing the pane rotated into it, and the tab is
# unzoomed. Swapping the first pane with each later one in turn walks it to the end and shifts the
# rest back by one. Custom commands run under /bin/sh, so the body runs in zsh for its arrays, and
# pane.focus by id is only reachable through the socket API.
[[keys.command]]
key = "prefix+ctrl+o"
type = "shell"
command = '''exec zsh -f -c 'request() { printf "{\"id\":\"rotate\",\"method\":\"%s\",\"params\":%s}\n" "$1" "$2" | nc -U -w 1 "$HERDR_SOCKET_PATH" >/dev/null; }; panes=($("$HERDR_BIN_PATH" pane list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r --arg t "$HERDR_ACTIVE_TAB_ID" ".result.panes[] | select(.tab_id == \$t) | .pane_id")); (( ${#panes} > 1 )) || exit 0; slot=${panes[(i)$HERDR_ACTIVE_PANE_ID]}; request pane.zoom "{\"pane_id\":\"$HERDR_ACTIVE_PANE_ID\",\"mode\":\"off\"}"; for (( i = 2; i <= ${#panes}; i++ )); do request pane.swap "{\"source_pane_id\":\"${panes[1]}\",\"target_pane_id\":\"${panes[i]}\"}"; done; rotated=($panes[2,-1] $panes[1]); request pane.focus "{\"pane_id\":\"${rotated[slot]}\"}"' '''

# tmux next-layout (Space), reduced: 2 panes flip side by side <-> stacked, 3 panes main on top <->
# main on the left, 4 panes add a 2x2 grid, other counts do nothing; every pane's process keeps
# running. See next-layout.ts. Custom commands run under /bin/sh -lc, so bun is called by full path.
[[keys.command]]
key = "prefix+space"
type = "shell"
command = '"$HOME/.bun/bin/bun" "$HOME/.config/herdr/next-layout.ts"'

# tmux confirm-before for kill-pane
[[keys.command]]
key = "prefix+x"
type = "popup"
width = 40
height = 3
command = '''printf "kill-pane? (y/n) "; stty raw -echo; a=$(dd bs=1 count=1 2>/dev/null); stty -raw echo; [ "$a" = y ] && "$HERDR_BIN_PATH" pane close "$HERDR_ACTIVE_PANE_ID"'''

# tmux confirm-before for kill-window
[[keys.command]]
key = "prefix+ampersand"
type = "popup"
width = 40
height = 3
command = '''printf "kill-window? (y/n) "; stty raw -echo; a=$(dd bs=1 count=1 2>/dev/null); stty -raw echo; [ "$a" = y ] && "$HERDR_BIN_PATH" tab close "$HERDR_ACTIVE_TAB_ID"'''

# paste from system clipboard; pane.send_input wraps text in bracketed paste
# when the pane enables it, unlike `herdr pane send-text`
[[keys.command]]
key = "prefix+]"
type = "shell"
command = '''pbpaste | jq -Rsc --arg pane "$HERDR_ACTIVE_PANE_ID" '{id: "paste", method: "pane.send_input", params: {pane_id: $pane, text: .}}' | nc -U -w 1 "$HERDR_SOCKET_PATH"'''
