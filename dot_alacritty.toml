
[env]
TERM = "xterm-256color"

[font]
builtin_box_drawing = true
size = 16

[font.glyph_offset]
y = 2

[font.normal]
family = "SauceCodePro Nerd Font"
style = "Regular"

[font.offset]
y = 4

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Command"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Equals"
mods = "Command"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Command"

[[keyboard.bindings]]
chars = "\u001F"
key = "Slash"
mods = "Control"

[general]
live_config_reload = true

[terminal]

[scrolling]
multiplier = 0

[terminal.shell]
program = "/bin/zsh"

[window]
decorations = "transparent"
dynamic_title = false
startup_mode = "Maximized"

[window.padding]
x = 2
y = 2

[keyboard]
